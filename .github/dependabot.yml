version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          graphql-codegen:
              patterns:
                  - "graphql"
                  - "graphql-*"
                  - "@graphql-codegen/*"
                  - "@graphql-typed-document-node/*"
          next:
              patterns:
                  - "next"
                  - "next-auth"
                  - "@auth/*"
                  - "eslint-config-next"
                  - "@next/*"
          all-dependencies:
              patterns:
                  - "*"
      ignore:
          - dependency-name: "eslint"
            update-types:
                - "version-update:semver-major"
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"
          # @mswjs/http-middleware 0.10.x is peer-bound to msw 2; msw 3 breaks the mock backend
          - dependency-name: "msw"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          all-actions:
              patterns:
                  - "*"
