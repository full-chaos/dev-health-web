# Mirror the Docker Hub images web CI needs to ghcr.io/full-chaos/dev-health-web/ (CHAOS-9065).
#
# WHY: web CI pulled node, traefik and moby/buildkit from Docker Hub without a login and hit the
# anonymous pull rate limit (429). Consumers now pull from this mirror with GITHUB_TOKEN.
#
# DIGESTS ARE PRESERVED: `docker buildx imagetools create` copies the manifest list verbatim, so the
# mirrored ref carries the SAME sha256 as upstream and every consumer pin stays a literal. The verify
# step fails the run if they ever differ. Same method as the ops repo's mirror-test-images.yml.
#
# NO setup-buildx and NO Docker Hub login, on purpose: setup-buildx would itself pull
# moby/buildkit from Docker Hub. `imagetools` needs no builder.
#
# Changing a ref: edit it HERE, in the Dockerfile (NODE_IMAGE), live-e2e.yml (traefik) and
# build-docker.yml (buildx driver-opts) together. The pull_request trigger fills the mirror from a
# same-repo branch before the consumers need it. Fork PRs cannot publish (read-only token).
name: Mirror CI images

on:
    workflow_dispatch:
    schedule:
        - cron: '23 4 * * 1'
    push:
        branches: [main]
        paths:
            - '.github/workflows/mirror-ci-images.yml'
            - 'Dockerfile'
    pull_request:
        paths:
            - '.github/workflows/mirror-ci-images.yml'
            - '.github/workflows/live-e2e.yml'
            - '.github/workflows/build-docker.yml'
            - 'Dockerfile'

permissions:
    contents: read

concurrency:
    group: mirror-ci-images-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            packages: write
        env:
            OWNER: ${{ github.repository_owner }}
            # <upstream ref pinned by digest> <destination path:tag under ghcr.io/<owner>/dev-health-web/>
            IMAGES: |
                docker.io/library/node:25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4 node:25-alpine
                docker.io/library/traefik:v3.1@sha256:74d72c7a1345984f186bddbabcc462b2128d0d8054177dc84afaeac4db1f0f56 traefik:v3.1
                docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea moby/buildkit:buildx-stable-1
        steps:
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Mirror each image to ghcr.io, preserving its digest
              run: |
                  set -euo pipefail
                  while read -r src dest; do
                    [ -n "${src}" ] || continue
                    target="ghcr.io/${OWNER}/dev-health-web/${dest}"
                    printf '\n=== from %s\n    to   %s\n' "${src}" "${target}"
                    docker buildx imagetools create --tag "${target}" "${src}"
                  done <<< "${IMAGES}"

            - name: Verify every mirrored digest matches upstream
              run: |
                  set -euo pipefail
                  failed=0
                  while read -r src dest; do
                    [ -n "${src}" ] || continue
                    target="ghcr.io/${OWNER}/dev-health-web/${dest}"
                    want="${src##*@}"
                    got=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "${target}")
                    if [ "${got}" = "${want}" ]; then
                      printf 'OK   %-32s %s\n' "${dest}" "${got}"
                    else
                      printf 'FAIL %-32s mirrored=%s want=%s\n' "${dest}" "${got}" "${want}" >&2
                      failed=1
                    fi
                  done <<< "${IMAGES}"
                  exit "${failed}"
