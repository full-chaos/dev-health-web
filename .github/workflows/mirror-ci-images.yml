# Mirror the Docker Hub images web CI needs to ghcr.io/full-chaos/dev-health-web/ (CHAOS-9065).
#
# WHY: web CI pulled node and traefik from Docker Hub (buildkit now comes from the ops org mirror) without a login and hit the
# anonymous pull rate limit (429). Consumers now pull from this mirror with GITHUB_TOKEN.
#
# DIGESTS ARE PRESERVED: `docker buildx imagetools create` copies the manifest list verbatim, so the
# mirrored ref carries the SAME sha256 as upstream and every consumer pin stays a literal. The verify
# step fails the run if they ever differ. Same method as the ops repo's mirror-test-images.yml.
#
# SOURCES are mirror.gcr.io (Google's pull-through cache of Docker Hub, as ops uses for base images):
# it serves the digest-pinned content without Docker Hub, so an outage or rate limit there does not
# block the mirror. The verify step proves the digests equal the Docker Hub ones pinned below.
#
# NO setup-buildx and NO Docker Hub login, on purpose: setup-buildx would itself pull
# moby/buildkit from Docker Hub. `imagetools` needs no builder.
#
# The refs and digests live in ci/ci-images.json (CHAOS-9070), the one source of truth; the Dockerfile
# ARG default is the only other literal and scripts/__tests__/ci-image-pins.test.mjs keeps them equal.
# Bump with `node scripts/bump-ci-images.mjs --write`. The pull_request trigger fills the mirror from a
# same-repo branch; consumers wait for it (.github/scripts/wait-for-ci-images.sh). Fork PRs and
# dependabot PRs cannot publish (read-only token).
name: Mirror CI images

on:
    workflow_dispatch:
    schedule:
        - cron: '23 4 * * 1'
    push:
        branches: [main]
        paths:
            - '.github/workflows/mirror-ci-images.yml'
            - 'Dockerfile'
            - 'ci/ci-images.json'
    pull_request:
        paths:
            - '.github/workflows/mirror-ci-images.yml'
            - '.github/workflows/live-e2e.yml'
            - '.github/workflows/build-docker.yml'
            - 'Dockerfile'
            - 'ci/ci-images.json'

permissions:
    contents: read

concurrency:
    group: mirror-ci-images-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Read the pinned images from ci/ci-images.json
              run: |
                  set -euo pipefail
                  {
                    echo 'IMAGES<<EOF_IMAGES'
                    for name in node traefik; do
                      echo "$(node scripts/bump-ci-images.mjs --ref "${name}" source) $(node scripts/bump-ci-images.mjs --ref "${name}" mirror)"
                    done
                    echo 'EOF_IMAGES'
                  } >> "${GITHUB_ENV}"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Mirror each image to ghcr.io, preserving its digest
              run: |
                  set -euo pipefail
                  while read -r src dest; do
                    [ -n "${src}" ] || continue
                    # dest is the pinned mirror ref; a tag cannot carry the digest, so drop it.
                    target="${dest%@*}"
                    printf '\n=== from %s\n    to   %s\n' "${src}" "${target}"
                    docker buildx imagetools create --tag "${target}" "${src}"
                  done <<< "${IMAGES}"

            - name: Verify every mirrored digest matches upstream
              run: |
                  set -euo pipefail
                  failed=0
                  while read -r src dest; do
                    [ -n "${src}" ] || continue
                    target="${dest%@*}"
                    want="${src##*@}"
                    got=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "${target}")
                    if [ "${got}" = "${want}" ]; then
                      printf 'OK   %-32s %s\n' "${dest}" "${got}"
                    else
                      printf 'FAIL %-32s mirrored=%s want=%s\n' "${dest}" "${got}" "${want}" >&2
                      failed=1
                    fi
                  done <<< "${IMAGES}"
                  exit "${failed}"
