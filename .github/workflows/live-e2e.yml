name: Live Backend E2E

on:
    workflow_dispatch:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              # Always run on workflow_dispatch
              if: github.event_name == 'pull_request'
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - '.github/workflows/live-e2e.yml'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'patches/**'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'playwright.config.*'
                        - 'playwright.live.config.*'
                        - 'eslint.config.*'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    live-e2e:
        needs: [changes]
        if: >-
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
            clickhouse:
                image: clickhouse/clickhouse-server:25.1
                env:
                    CLICKHOUSE_DB: default
                    CLICKHOUSE_USER: ch
                    CLICKHOUSE_PASSWORD: ch
                ports:
                    - 8123:8123
                    # CHAOS-7001: dev-health-ops's Go binaries (dho api / dho query-api) open
                    # CLICKHOUSE_URI over the NATIVE protocol on port 9000 -- unlike Python's
                    # clickhouse-connect, which is happy on the HTTP port 8123 this service
                    # already published. Without this, the Go planes below cannot reach
                    # ClickHouse at all regardless of what else is configured correctly.
                    - 9000:9000
                options: >-
                    --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - name: Checkout web
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve dev-health-ops ref
              id: ops-ref
              shell: bash
              run: |
                  ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
                  if git ls-remote --exit-code --heads https://github.com/full-chaos/dev-health-ops.git "${ref}" >/dev/null 2>&1; then
                    echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
                  else
                    echo "ref=main" >> "${GITHUB_OUTPUT}"
                  fi

            - name: Checkout dev-health-ops
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: full-chaos/dev-health-ops
                  path: dev-health-ops
                  ref: ${{ steps.ops-ref.outputs.ref }}

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 25
                  cache: pnpm

            - name: Install web dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: dev-health-ops/go.mod
                  cache-dependency-path: dev-health-ops/go.sum

            - name: Build dev-health-ops go binary (dho)
              # CHAOS-7001: the go-api and query-api planes below are two subcommands of this
              # ONE binary (`dho api`, `dho query-api`), the same binary prod/bigboy run --
              # never a separate build.
              run: go build -o /tmp/dho ./cmd/dho
              working-directory: dev-health-ops

            - name: Check GraphQL schema drift
              # The Go gqlgen schema is the source of truth; the ops repo pins it byte-for-byte
              # at contracts/graphql/v1/schema.graphql (checked out above). A missing file or
              # any diff FAILS -- there is no skip path.
              run: |
                  pin=dev-health-ops/contracts/graphql/v1/schema.graphql
                  if [ ! -f "$pin" ]; then
                    echo "::error::ops GraphQL contract pin not found at $pin"
                    exit 1
                  fi
                  diff -u "$pin" src/lib/graphql/schema.graphql || {
                    echo "::error::GraphQL schema drift vs ops contract pin. Copy $pin verbatim to src/lib/graphql/schema.graphql and run codegen."
                    exit 1
                  }

            - name: Run dev-health-ops migrations (dho)
              # CHAOS-7053: the Go runner of the same schema: Postgres, then the standard
              # feature flags, then the ClickHouse schema (ops internal/rivermigrate/upgrade.go).
              # ClickHouse over the NATIVE port 9000, like the go-api/query-api step below.
              env:
                  POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
                  CLICKHOUSE_URI: clickhouse://ch:ch@localhost:9000/default
                  # Production's settings; without them `dho migrate postgres` refuses
                  # (ops ci/check_go_containers.sh smoke_migrate_postgres).
                  DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: "1"
                  OPERATIONAL_ORDERING_CONTRACT: "2"
              run: /tmp/dho migrate upgrade

            - name: Seed dev-health-ops fixtures (dho)
              # CHAOS-7053: the frozen world the web e2e caller owns (ops
              # internal/fixturescli/generate_integration_test.go generateParameterSets):
              # any other parameter set is refused. Only CLICKHOUSE_URI is set: the verb
              # refuses when a Postgres URI is present (it does not seed demo users).
              env:
                  CLICKHOUSE_URI: clickhouse://ch:ch@localhost:9000/default
              run: |
                  /tmp/dho fixtures generate \
                    --sink "$CLICKHOUSE_URI" \
                    --db-type clickhouse \
                    --repo-name acme/live-e2e \
                    --provider synthetic \
                    --days 14 \
                    --commits-per-day 6 \
                    --pr-count 24 \
                    --team-count 10 \
                    --seed 20260219 \
                    --with-metrics \
                    --with-work-graph

            - name: Generate the query-api envelope JWKS (job-local, nothing stored)
              # CHAOS-7554: since ops CHAOS-6290 (edge users store) query-api refuses to start with
              # GO_API_EDGE_JWT_SECRET set unless its /query route is configured, and that route needs
              # GO_API_REGISTRY_POSTGRES_URI plus the envelope trio (JWKS path, issuer, audience). Same
              # recipe as ops ci/lib/go_api_prove_e2e.sh: an ed25519 key pair is generated here, the PUBLIC
              # half is written as the JWKS the verifier reads, and the private half is deleted at once:
              # nothing in this job signs an envelope, so no key outlives this step and nothing is echoed.
              run: |
                  set -euo pipefail
                  umask 077
                  dir="${RUNNER_TEMP}/live-e2e-envelope"
                  mkdir -p "${dir}"
                  openssl genpkey -algorithm ed25519 -out "${dir}/envelope.pem"
                  x="$(openssl pkey -in "${dir}/envelope.pem" -pubout -outform DER | tail -c 32 | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
                  rm -f "${dir}/envelope.pem"
                  printf '{"keys":[{"kty":"OKP","crv":"Ed25519","kid":"live-e2e","use":"sig","alg":"EdDSA","x":"%s"}]}\n' "${x}" > "${dir}/jwks.json"
                  test "$(openssl base64 -d -A <<<"$(printf '%s' "${x}" | tr '_-' '/+')==" | wc -c)" -ge 32
                  echo "LIVE_E2E_JWKS_PATH=${dir}/jwks.json" >> "${GITHUB_ENV}"

            - name: Start dev-health-ops go-api and query-api
              # CHAOS-7001: mirror what prod's Ingress and bigboy's traefik plane-split router
              # do -- routes ci/go_served_paths.tsv marks go-api/query-api-owned are served by
              # these two dho subcommands (CHAOS-7523: there is no Python api any more; the catch-all is go-api). Bare processes, same
              # style as "Start dev-health-ops API" -- no docker network needed since the
              # traefik router below reaches all three over 127.0.0.1 (--network host).
              env:
                  POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
                  API_DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
                  # Native protocol, port 9000 (see the clickhouse service's port comment above)
                  # -- NOT the 8123 HTTP port Python's CLICKHOUSE_URI above uses.
                  CLICKHOUSE_URI: clickhouse://ch:ch@localhost:9000/default
                  API_CLICKHOUSE_URI: clickhouse://ch:ch@localhost:9000/default
                  # The edge JWT secret: both go-api (its own
                  # edgetoken check) and query-api (GO_API_EDGE_JWT_SECRET) must verify the
                  # SAME end-user JWT go-api issues.
                  JWT_SECRET_KEY: live-e2e-test-secret-do-not-use-in-production
                  GO_API_EDGE_JWT_SECRET: live-e2e-test-secret-do-not-use-in-production
                  # The settings encryption key: go-api's
                  # credentials routes seal/open the SAME encrypted column
                  # (integration_credentials.credentials_encrypted) Python writes, with the same
                  # cipher (internal/api/credentials/connection.go requires this explicitly --
                  # confirmed via the failing run's log: "provider credential is invalid" on save,
                  # unrelated to the request payload).
                  SETTINGS_ENCRYPTION_KEY: live-e2e-test-settings-key-do-not-use
                  # The fail-closed rate-limit posture
                  # otherwise refuses to start without a shared VALKEY_URI.
                  ENVIRONMENT: development
                  # The suite registers a user per describe group from one IP; the default register throttle
                  # (3/hour, ops internal/api/session AUTH_REGISTER_LIMIT) would throttle the rest of the run.
                  # Raised HERE only (CHAOS-7523: go-api now serves register; the Python step that set it is gone).
                  AUTH_REGISTER_LIMIT: 1000/hour
                  # CHAOS-7554: the /query route's own configuration (see the JWKS step above): registry
                  # Postgres in the pgx form, and the envelope trio the route requires.
                  GO_API_REGISTRY_POSTGRES_URI: postgres://postgres:postgres@localhost:5432/test_db?sslmode=disable
                  GO_API_ENVELOPE_JWKS_PATH: ${{ env.LIVE_E2E_JWKS_PATH }}
                  GO_API_ENVELOPE_ISSUER: dev-health-ops-edge
                  GO_API_ENVELOPE_AUDIENCE: query-api
                  CORS_ALLOWED_ORIGINS: "http://127.0.0.1:3002,http://localhost:3002,http://127.0.0.1:8000,http://127.0.0.1:8099"
                  # query-api's per-route Go-plane switches -- plain in-memory flags flipped once
                  # at boot (never Postgres, never the routeswitch ledger). Copied verbatim from
                  # ci/bigboy/compose.bigboy.images.yml's query-api block (deploy/values.prod.yaml's
                  # own queryApi env), the canonical list -- re-derive from there, never hand-add.
                  GO_API_QUADRANT_ENABLED: "true"
                  GO_API_FILTER_OPTIONS_ENABLED: "true"
                  GO_API_DRILLDOWN_PRS_ENABLED: "true"
                  GO_API_DRILLDOWN_ISSUES_ENABLED: "true"
                  GO_API_META_ENABLED: "true"
                  GO_API_EXPLAIN_ENABLED: "true"
                  GO_API_PEOPLE_SEARCH_ENABLED: "true"
                  GO_API_PEOPLE_SUMMARY_ENABLED: "true"
                  GO_API_PEOPLE_METRIC_ENABLED: "true"
                  GO_API_FLAME_ENABLED: "true"
                  GO_API_PEOPLE_DRILLDOWN_PRS_ENABLED: "true"
                  GO_API_PEOPLE_DRILLDOWN_ISSUES_ENABLED: "true"
                  GO_API_FLAME_AGGREGATED_ENABLED: "true"
                  GO_API_HEATMAP_ENABLED: "true"
                  GO_API_SANKEY_ENABLED: "true"
                  GO_API_INVESTMENT_ENABLED: "true"
                  GO_API_INVESTMENT_FLOW_ENABLED: "true"
                  GO_API_INVESTMENT_SUNBURST_ENABLED: "true"
                  GO_API_HOME_ENABLED: "true"
                  GO_API_OPPORTUNITIES_ENABLED: "true"
                  GO_API_WORK_UNITS_ENABLED: "true"
                  GO_API_WORK_UNIT_EXPLAIN_ENABLED: "true"
                  GO_API_INVESTMENT_EXPLAIN_ENABLED: "true"
              run: |
                  nohup /tmp/dho api --api-addr=127.0.0.1:8001 --http-addr=127.0.0.1:8002 \
                    >/tmp/dev-health-go-api.log 2>&1 &
                  echo $! >/tmp/dev-health-go-api.pid
                  nohup /tmp/dho query-api --query-addr=127.0.0.1:8090 --http-addr=127.0.0.1:8092 \
                    >/tmp/dev-health-query-api.log 2>&1 &
                  echo $! >/tmp/dev-health-query-api.pid

                  for name_addr in "go-api 127.0.0.1:8002" "query-api 127.0.0.1:8092"; do
                    name="${name_addr%% *}"
                    addr="${name_addr#* }"
                    ok=0
                    for i in {1..60}; do
                      if curl -fsS "http://${addr}/healthz" >/dev/null; then
                        ok=1
                        break
                      fi
                      sleep 2
                    done
                    if [ "${ok}" -ne 1 ]; then
                      echo "${name} failed health check startup window"
                      cat "/tmp/dev-health-${name}.log" || true
                      exit 1
                    fi
                  done
              working-directory: dev-health-ops

            - name: Generate and start live-e2e plane router (traefik)
              # CHAOS-7001: the piece that actually makes the plane split real. CHAOS-7523: there is no
              # Python api any more; the catch-all ("/") is go-api, as on prod's api host, and /graphql
              # is query-api.
              #
              # --query-api-only /api/v1/meta,/api/v1/home: query-api's other ledger-listed paths
              # (investment/flow, sankey, people/*, flame, ...) are not exercised by the live suite;
              # meta and home are, and home mounts now that the step above provisions /query
              # (GO_API_ENVELOPE_*, GO_API_REGISTRY_POSTGRES_URI). Everything else falls to go-api,
              # whose ~100 ledger paths mount unconditionally.
              run: |
                  mkdir -p /tmp/traefik-dynamic
                  node ci/generate-live-e2e-plane-router.mjs \
                    dev-health-ops/ci/go_served_paths.tsv \
                    --api-port 8001 --go-api-port 8001 --query-api-port 8090 \
                    --query-api-only /api/v1/meta,/api/v1/home --query-api-extra /graphql \
                    > /tmp/traefik-dynamic/planes.yml
                  cat /tmp/traefik-dynamic/planes.yml

                  docker run -d --name live-e2e-traefik --network host \
                    -v /tmp/traefik-dynamic:/etc/traefik/dynamic:ro \
                    traefik:v3.1 \
                    --providers.file.directory=/etc/traefik/dynamic \
                    --providers.file.watch=false \
                    --entrypoints.web.address=:8099 \
                    --log.level=INFO

                  for i in {1..30}; do
                    if curl -fsS http://127.0.0.1:8099/health >/dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "traefik router failed health check startup window (via catch-all -> api)"
                  docker logs live-e2e-traefik || true
                  exit 1

            - name: Seed test superuser
              env:
                  BACKEND_URL: http://127.0.0.1:8099
                  SUPERUSER_EMAIL: admin@devhealth.example
                  SUPERUSER_PASSWORD: DevHealth123!Admin
                  PGPASSWORD: postgres
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends postgresql-client
                  python3 -m pip install --quiet bcrypt

                  # Try to register the superuser via the public API. Tolerate
                  # 400/409 because the fixtures step may already have created
                  # this account with an unknown password — the SQL step below
                  # rewrites the password hash regardless.
                  status=$(curl -s -o /tmp/reg.json -w '%{http_code}' \
                    -X POST "${BACKEND_URL}/api/v1/auth/register" \
                    -H 'Content-Type: application/json' \
                    -H "Origin: ${BACKEND_URL}" \
                    -d "{\"email\":\"${SUPERUSER_EMAIL}\",\"password\":\"${SUPERUSER_PASSWORD}\",\"full_name\":\"Test Superuser\"}")
                  echo "register status=${status}"
                  cat /tmp/reg.json || true
                  case "${status}" in
                    201|400|409) ;;
                    *) echo "::error::Unexpected register status ${status}" ; exit 1 ;;
                  esac

                  # Compute the bcrypt hash of our known password so we can
                  # overwrite whatever hash the fixtures / register step produced.
                  # This guarantees the smoke-test login below uses OUR password.
                  HASH=$(python3 -c "import bcrypt,os; print(bcrypt.hashpw(os.environ['SUPERUSER_PASSWORD'].encode(), bcrypt.gensalt()).decode())")

                  # Overwrite password, promote to superuser, mark verified.
                  # `\gexec` generates one UPDATE per column that actually exists
                  # in the `users` table, so we don't hardcode a schema and we
                  # never reference a missing column (the SQL parser would choke).
                  # The password column is probed across three conventional names
                  # (hashed_password / password_hash / password); flag columns
                  # similarly across is_superuser / is_verified / email_verified /
                  # is_active.
                  psql -h localhost -U postgres -d test_db \
                    -v email="${SUPERUSER_EMAIL}" -v hash="${HASH}" <<'SQL'
                  \set ON_ERROR_STOP on
                  SELECT format(
                    'UPDATE users SET %I = %L WHERE email = %L',
                    column_name, :'hash', :'email'
                  )
                    FROM information_schema.columns
                   WHERE table_name='users'
                     AND column_name IN ('hashed_password','password_hash','password')
                  \gexec

                  SELECT format(
                    'UPDATE users SET %I = true WHERE email = %L',
                    column_name, :'email'
                  )
                    FROM information_schema.columns
                   WHERE table_name='users'
                     AND column_name IN ('is_superuser','is_verified','email_verified','is_active')
                  \gexec

                  SELECT email,
                         (SELECT column_name FROM information_schema.columns
                            WHERE table_name='users' AND column_name='is_superuser') IS NOT NULL AS has_is_superuser
                    FROM users WHERE email = :'email';
                  SQL

                  # Smoke-test the credentials end-to-end so a failure at this step
                  # surfaces loudly instead of leaving us to debug opaque 'skipped'
                  # results in Playwright.
                  login_status=$(curl -s -o /tmp/login.json -w '%{http_code}' \
                    -X POST "${BACKEND_URL}/api/v1/auth/login" \
                    -H 'Content-Type: application/json' \
                    -d "{\"email\":\"${SUPERUSER_EMAIL}\",\"password\":\"${SUPERUSER_PASSWORD}\"}")
                  echo "superuser login status=${login_status}"
                  cat /tmp/login.json || true
                  if [ "${login_status}" != "200" ]; then
                    echo "::error::Seeded superuser cannot authenticate; onboarding-ui tests will skip."
                    exit 1
                  fi

                  # CHAOS-7554: reach the Go /graphql on query-api itself (:8090, the router does not send /graphql
                  # there yet) with the seeded user's token and a REGISTERED document (query-api answers
                  # UNREGISTERED_DOCUMENT for anything else), built the way the web client puts it on the wire
                  # (ci/live-e2e-graphql-body.ts). The token is read into a variable and never printed.
                  token="$(jq -r '.access_token // .token // empty' /tmp/login.json)"
                  org_id="$(jq -r '.user.org_id // empty' /tmp/login.json)"
                  test -n "${token}" && test -n "${org_id}" || { echo "::error::login response carries no access token or org id"; exit 1; }
                  # the tsx binary directly (not `pnpm exec`): pnpm may write its own lines to stdout,
                  # and the body file must be exactly the JSON the script prints.
                  ./node_modules/.bin/tsx ci/live-e2e-graphql-body.ts "${org_id}" > /tmp/gql-body.json
                  jq -e '.query and .variables' /tmp/gql-body.json >/dev/null || { echo "::error::the smoke body is not the expected JSON"; exit 1; }
                  gql_status=$(curl -s -o /tmp/gql.json -w '%{http_code}' \
                    -X POST "http://127.0.0.1:8090/graphql" \
                    -H 'Content-Type: application/json' \
                    -H "Authorization: Bearer ${token}" \
                    --data-binary @/tmp/gql-body.json)
                  echo "graphql status=${gql_status}"
                  head -c 300 /tmp/gql.json || true; echo
                  # 200 alone is not proof: assert the answer is the Go query-api's own GraphQL answer for a
                  # registered document: data, or the operation-switch refusal (CI has no routing rows, so data
                  # operations answer OPERATION_NOT_ENABLED here). UNREGISTERED_DOCUMENT or a 401 is a failure.
                  if ! jq -e '(.data != null) or (.errors[0].extensions.code == "OPERATION_NOT_ENABLED")' /tmp/gql.json >/dev/null; then
                    echo "::error::/graphql on query-api answered, but not as the Go registered-document path."
                    exit 1
                  fi
                  if [ "${gql_status}" != "200" ]; then
                    echo "::error::/graphql on query-api did not answer 200 (Go query-api not serving the product path)."
                    exit 1
                  fi

            - name: Run live backend e2e tier
              env:
                  # CHAOS-7001: through the plane-split router, not the Python api directly --
                  # go-api/query-api-owned paths must reach those planes the way prod's Ingress
                  # (and bigboy's traefik) route them, or they 500 on their Python stub.
                  PLAYWRIGHT_LIVE_BACKEND_URL: http://127.0.0.1:8099
                  TEST_SUPERUSER_EMAIL: admin@devhealth.example
                  TEST_SUPERUSER_PASSWORD: DevHealth123!Admin
                  TEST_TARGET_USER_ID: ${{ secrets.TEST_TARGET_USER_ID }}
                  TEST_SUPERUSER_TARGET_USER_ID: ${{ secrets.TEST_SUPERUSER_TARGET_USER_ID }}
              run: bash ci/run_tests.sh live-e2e

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report-live
                  path: playwright-report

            - name: Upload API logs on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dev-health-ops-go-logs
                  path: |
                      /tmp/dev-health-go-api.log
                      /tmp/dev-health-query-api.log

            - name: Stop dev-health-ops API
              if: always()
              run: |
                  if [ -f /tmp/dev-health-go-api.pid ]; then
                    kill "$(cat /tmp/dev-health-go-api.pid)" || true
                  fi
                  if [ -f /tmp/dev-health-query-api.pid ]; then
                    kill "$(cat /tmp/dev-health-query-api.pid)" || true
                  fi
                  docker rm -f live-e2e-traefik >/dev/null 2>&1 || true
