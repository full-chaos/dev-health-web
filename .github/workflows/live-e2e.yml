name: Live Backend E2E

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@v4.0.1 # v4
        id: filter
        # Always run on workflow_dispatch
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'vitest.config.*'
              - 'playwright.config.*'
              - 'playwright.live.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'codegen.ts'
              - 'instrumentation.ts'
              - 'sentry.*.config.ts'

  live-e2e:
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout web
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout dev-health-ops
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: full-chaos/dev-health-ops
          path: dev-health-ops

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 25
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev-health-ops dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: dev-health-ops

      - name: Check GraphQL schema drift
        run: |
          if ! PYTHONPATH=dev-health-ops/src python3 -m dev_health_ops.api.graphql.export_schema \
            --out /tmp/backend-schema.graphql 2>/dev/null; then
            echo "::warning::export_schema module not available, skipping drift check"
            exit 0
          fi
          diff src/lib/graphql/schema.graphql /tmp/backend-schema.graphql || {
            echo "::error::GraphQL schema drift detected! Run codegen and commit updated schema."
            exit 1
          }

      - name: Run dev-health-ops migrations
        env:
          DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: alembic -c alembic.ini upgrade head
        working-directory: dev-health-ops

      - name: Seed dev-health-ops fixtures
        env:
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          python -m dev_health_ops.cli \
            --db "$POSTGRES_URI" \
            --analytics-db "$CLICKHOUSE_URI" \
            fixtures generate \
            --sink "$CLICKHOUSE_URI" \
            --days 30 \
            --with-metrics \
            --with-work-graph
        working-directory: dev-health-ops

      - name: Start dev-health-ops API
        env:
          DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          CORS_ALLOWED_ORIGINS: "http://127.0.0.1:3002,http://localhost:3002,http://127.0.0.1:8000"
        run: |
          nohup python -m dev_health_ops.cli \
            --db "$DATABASE_URI" \
            --analytics-db "$CLICKHOUSE_URI" \
            api --host 127.0.0.1 --port 8000 >/tmp/dev-health-ops-api.log 2>&1 &
          echo $! >/tmp/dev-health-ops-api.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API failed health check startup window"
          cat /tmp/dev-health-ops-api.log || true
          exit 1
        working-directory: dev-health-ops

      - name: Run live backend e2e tier
        env:
          PLAYWRIGHT_LIVE_BACKEND_URL: http://127.0.0.1:8000
          TEST_SUPERUSER_EMAIL: ${{ secrets.TEST_SUPERUSER_EMAIL }}
          TEST_SUPERUSER_PASSWORD: ${{ secrets.TEST_SUPERUSER_PASSWORD }}
          TEST_TARGET_USER_ID: ${{ secrets.TEST_TARGET_USER_ID }}
          TEST_SUPERUSER_TARGET_USER_ID: ${{ secrets.TEST_SUPERUSER_TARGET_USER_ID }}
        run: bash ci/run_tests.sh live-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-live
          path: playwright-report

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-health-ops-api-log
          path: /tmp/dev-health-ops-api.log

      - name: Stop dev-health-ops API
        if: always()
        run: |
          if [ -f /tmp/dev-health-ops-api.pid ]; then
            kill "$(cat /tmp/dev-health-ops-api.pid)" || true
          fi
