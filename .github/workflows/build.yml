name: Build

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - '.github/workflows/build.yml'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'patches/**'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'eslint.config.*'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    build:
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm binary
              id: pnpm-bin
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Setup pnpm
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              timeout-minutes: 3

            - name: Save pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Use cached pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit == 'true'
              timeout-minutes: 3
              env:
                  PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
              run: |
                  echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$HOME/setup-pnpm/node_modules/.bin/bin" >> "$GITHUB_PATH"
                  echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
                  PATH="$HOME/setup-pnpm/node_modules/.bin/bin:$HOME/setup-pnpm/node_modules/.bin:$PATH"
                  test "$(pnpm --version)" = "$PNPM_VERSION"

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 22
            - name: Locate pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-
                      pnpm-store-${{ runner.os }}-

            - name: Install dependencies
              id: pnpm-install
              run: pnpm install --frozen-lockfile
            - name: Save pnpm store
              if: ${{ steps.pnpm-install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Save partial pnpm store
              if: ${{ always() && (steps.pnpm-install.outcome == 'failure' || steps.pnpm-install.outcome == 'cancelled') }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
            - name: Build
              run: pnpm build
