name: Build Docker Image

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: "Image tag (e.g., v1.0.0, pr-123, feature-xyz)"
                required: false
                default: ""
            push:
                description: "Push image to registry"
                required: false
                type: boolean
                default: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              # Always run on workflow_dispatch and release events
              if: github.event_name == 'pull_request' || github.event_name == 'push'
              with:
                  filters: |
                      code:
                          - 'src/**'
                          - 'public/**'
                          - 'package.json'
                          - 'package-lock.json'
                          - 'tsconfig.json'
                          - 'next.config.*'
                          - 'Dockerfile'
                          - 'docker-compose.yml'
                          - 'compose.dev.yml'
                          - '.dockerignore'

    build:
        name: Build Image
        needs: [changes]
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'release' ||
            needs.changes.outputs.code == 'true'
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        outputs:
            version: ${{ steps.meta.outputs.version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Generate image metadata
              id: meta
              run: |
                  VERSION=$(bash .github/scripts/generate-version-tag.sh "${{ github.event.inputs.tag }}" "true")
                  IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

                  SHOULD_PUSH="true"
                  if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event.inputs.push }}" == "false" ]; then
                    SHOULD_PUSH="false"
                  fi
                  echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
              env:
                  GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to GitHub Container Registry
              if: steps.meta.outputs.should_push == 'true'
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      BACKEND_URL=${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  outputs: ${{ steps.meta.outputs.should_push == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || format('type=oci,dest=/tmp/docker-image-{0}.tar', strategy.job-index) }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Export digest
              if: steps.meta.outputs.should_push == 'true'
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: steps.meta.outputs.should_push == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ strategy.job-index }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload image artifact (PR builds)
              if: steps.meta.outputs.should_push == 'false'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docker-image-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ steps.meta.outputs.version }}
                  path: /tmp/docker-image-*.tar
                  retention-days: 3

    merge:
        name: Merge Digests
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        steps:
            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
