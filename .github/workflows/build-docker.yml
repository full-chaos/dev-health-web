name: Build Docker Image

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: "Image tag (e.g., v1.0.0, pr-123, feature-xyz)"
                required: false
                default: ""
            push:
                description: "Push image to registry"
                required: false
                type: boolean
                default: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              # Always run on workflow_dispatch and release events
              if: github.event_name == 'pull_request' || github.event_name == 'push'
              with:
                  filters: |
                      code:
                          - 'src/**'
                          - 'public/**'
                          - '.github/workflows/build-docker.yml'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - 'patches/**'
                          - 'tsconfig.json'
                          - 'next.config.*'
                          - 'Dockerfile'
                          - 'ci/ci-images.json'
                          - '.github/scripts/wait-for-ci-images.sh'
                          - 'docker-compose.yml'
                          - 'compose.dev.yml'
                          - '.dockerignore'
                          - '.github/scripts/generate-version-tag.sh'

    build:
        name: Build Image
        needs: [changes]
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'release' ||
            needs.changes.outputs.code == 'true'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-26.04-arm
        outputs:
            version: ${{ steps.meta.outputs.version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Generate image metadata
              id: meta
              run: |
                  VERSION=$(bash .github/scripts/generate-version-tag.sh "${{ github.event.inputs.tag }}" "true")
                  IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

                  SHOULD_PUSH="true"
                  if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event.inputs.push }}" == "false" ]; then
                    SHOULD_PUSH="false"
                  fi
                  echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
              env:
                  GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

            # Log in BEFORE setup-buildx: the builder image and the Dockerfile base are pulled from the
            # ghcr.io mirror (CHAOS-9065), not Docker Hub, which rate-limits anonymous CI pulls.
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The node pin comes from ci/ci-images.json (CHAOS-9070); buildkit is the org mirror owned by ops, pinned below. On a PR that bumps them the mirror job fills
            # the mirror at the same time, so wait for it; a missing ref fails, never falls back.
            - name: Read pinned images and wait for the mirror
              id: pins
              run: |
                  bash .github/scripts/wait-for-ci-images.sh node
                  echo "node=$(node scripts/bump-ci-images.mjs --ref node mirror)" >> "${GITHUB_OUTPUT}"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  driver-opts: image=ghcr.io/full-chaos/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      BACKEND_URL=${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
                      NODE_IMAGE=${{ steps.pins.outputs.node }}
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  outputs: ${{ steps.meta.outputs.should_push == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || format('type=oci,dest=/tmp/docker-image-{0}.tar', strategy.job-index) }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Export digest
              if: steps.meta.outputs.should_push == 'true'
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: steps.meta.outputs.should_push == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ strategy.job-index }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload image artifact (PR builds)
              if: steps.meta.outputs.should_push == 'false'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docker-image-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ steps.meta.outputs.version }}
                  path: /tmp/docker-image-*.tar
                  retention-days: 3

    merge:
        name: Merge Digests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: build
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        steps:
            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            # Log in BEFORE setup-buildx: the builder image and the Dockerfile base are pulled from the
            # ghcr.io mirror (CHAOS-9065), not Docker Hub, which rate-limits anonymous CI pulls.
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  driver-opts: image=ghcr.io/full-chaos/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
