name: Build Docker Image

permissions:
    contents: read
    packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag (e.g., v1.0.0, pr-123, feature-xyz)'
                required: false
                default: ''
            push:
                description: 'Push image to registry'
                required: false
                type: boolean
                default: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
              id: filter
              # Always run on workflow_dispatch and release events
              if: github.event_name == 'pull_request' || github.event_name == 'push'
              with:
                  filters: |
                      code:
                          - 'src/**'
                          - 'public/**'
                          - 'package.json'
                          - 'package-lock.json'
                          - 'tsconfig.json'
                          - 'next.config.*'
                          - 'Dockerfile'
                          - 'docker-compose.yml'
                          - 'compose.dev.yml'
                          - '.dockerignore'

    build:
        name: Build Image
        needs: [changes]
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'release' ||
            needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                platform: [linux/amd64, linux/arm64]
        outputs:
            version: ${{ steps.meta.outputs.version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Generate image metadata
              id: meta
              run: |
                  VERSION=$(bash .github/scripts/generate-version-tag.sh "${{ github.event.inputs.tag }}" "true")
                  IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

                  SHOULD_PUSH="true"
                  if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event.inputs.push }}" == "false" ]; then
                    SHOULD_PUSH="false"
                  fi
                  echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
              env:
                  GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Log in to GitHub Container Registry
              if: steps.meta.outputs.should_push == 'true'
              uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      BACKEND_URL=${{ secrets.BACKEND_URL || 'http://127.0.0.1:8000' }}
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  outputs: ${{ steps.meta.outputs.should_push == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || format('type=oci,dest=/tmp/docker-image-{0}.tar', strategy.job-index) }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Export digest
              if: steps.meta.outputs.should_push == 'true'
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: steps.meta.outputs.should_push == 'true'
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: digests-${{ strategy.job-index }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload image artifact (PR builds)
              if: steps.meta.outputs.should_push == 'false'
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: docker-image-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ steps.meta.outputs.version }}
                  path: /tmp/docker-image-*.tar
                  retention-days: 3

    merge:
        name: Merge Digests
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        steps:
            - name: Download digests
              uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
