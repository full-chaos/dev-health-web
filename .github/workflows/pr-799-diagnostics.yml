name: PR 799 diagnostics

on:
    pull_request:

permissions:
    contents: read

jobs:
    dependency-artifact:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Add workspace security overrides
              run: |
                  cat > pnpm-workspace.yaml <<'YAML'
                  overrides:
                      fast-uri: 3.1.4
                      postcss: 8.5.16
                      sharp: 0.35.0

                  allowBuilds:
                      "@sentry/cli": true
                      esbuild: true
                      lefthook: true
                      msw: true
                      sharp: true
                      unrs-resolver: true
                  YAML
                  pnpm install
            - name: Verify high-severity audit gate
              run: pnpm audit --audit-level=high --prod
            - name: Verify build
              run: pnpm build
            - name: Verify unit tests
              run: pnpm test:unit
            - name: Upload dependency remediation
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: pr-799-dependency-fix
                  path: |
                      pnpm-workspace.yaml
                      pnpm-lock.yaml
                  retention-days: 1
