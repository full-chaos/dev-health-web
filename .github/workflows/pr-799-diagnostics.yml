name: PR 799 diagnostics

on:
    pull_request:
    push:
        branches:
            - feature/fc-infinity-themes

permissions:
    contents: read

jobs:
    diagnose:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit
              continue-on-error: true
              run: pnpm audit --audit-level=high --prod

            - name: Codegen check
              continue-on-error: true
              run: pnpm codegen:check

            - name: Lint
              continue-on-error: true
              run: pnpm lint

            - name: Typecheck
              continue-on-error: true
              run: pnpm typecheck

            - name: Format authenticated layout
              continue-on-error: true
              run: pnpm exec prettier --check 'src/app/(app)/layout.tsx'

            - name: Format authenticated layout test
              continue-on-error: true
              run: pnpm exec prettier --check 'src/app/(app)/layout.test.tsx'

            - name: Format root layout
              continue-on-error: true
              run: pnpm exec prettier --check src/app/layout.tsx

            - name: Format FC Infinity CSS
              continue-on-error: true
              run: pnpm exec prettier --check src/app/fc-infinity-themes.css

            - name: Format ThemeToggle
              continue-on-error: true
              run: pnpm exec prettier --check src/components/ThemeToggle.tsx

            - name: Format ThemeToggle test
              continue-on-error: true
              run: pnpm exec prettier --check src/components/ThemeToggle.test.tsx

            - name: Format PreferencesSettings
              continue-on-error: true
              run: pnpm exec prettier --check src/components/settings/PreferencesSettings.tsx

            - name: Format PreferencesSettings test
              continue-on-error: true
              run: pnpm exec prettier --check src/components/settings/PreferencesSettings.test.tsx

            - name: Format FC Infinity contract test
              continue-on-error: true
              run: pnpm exec prettier --check src/lib/__tests__/fcInfinityTheme.test.ts
