name: PR 799 dependency finalizer

on:
    pull_request:

permissions:
    contents: write

jobs:
    finalize-lockfile:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - name: Regenerate lockfile with the fast-uri override
              run: pnpm install --lockfile-only --no-frozen-lockfile --force
            - name: Verify frozen install and audit policy
              run: |
                  pnpm install --frozen-lockfile
                  pnpm audit --audit-level=high --prod
            - name: Commit generated lockfile
              env:
                  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  if git diff --quiet -- pnpm-lock.yaml; then
                      echo "Lockfile is already current."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add pnpm-lock.yaml
                  git commit -m "chore(deps): resolve fast-uri audit finding"
                  git push origin "HEAD:${HEAD_BRANCH}"
