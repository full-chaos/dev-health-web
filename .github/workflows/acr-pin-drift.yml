# Fail when the vendored ACR contract pin drifts from acr main (CHAOS-11907, INV-4).
# Exit 1 = drift, exit 2 = the check could not fetch (also red; never read as current).
name: ACR pin drift

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    drift:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 22
            - name: Compare the vendored pin with acr main
              run: node scripts/check-acr-pin-drift.mjs
