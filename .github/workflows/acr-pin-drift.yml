# Compare the vendored ACR contract pin with acr main (CHAOS-11907, INV-4; CHAOS-12341, D6614).
#
# Main, schedule and manual runs are strict: drift turns the run red and keeps it red until the pin
# is bumped. On drift they also open (or update) ONE pin-bump PR with the org secret
# DEV_HEALTH_REPO_TOKEN, so the PR runs CI (a PR opened with the workflow token would not). Only if
# the PR step fails do they open one "ACR pin drift: <acr sha>" issue instead; the issue closes when
# the drift clears or the PR is up.
# The PR targets the ref the run started on: main on schedule and push, any branch on dispatch (a
# dispatch off the default branch opens a draft PR from bot/acr-pin-bump-test, for tests).
# A PR run is strict only when the PR changes the vendored contracts or the generator that writes
# them (scripts/acr-pin-scope.mjs lists the paths). For any other PR, drift is a warning, so an acr
# main move never turns unrelated PRs red. Exit 1 = drift, exit 2 = the check could not fetch (also red where strict).
name: ACR pin drift

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '17 * * * *'
    workflow_dispatch:

permissions: {}

jobs:
    drift:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            status: ${{ steps.check.outputs.status }}
            pin: ${{ steps.check.outputs.pin }}
            head: ${{ steps.check.outputs.head }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 22
            - name: List the files this PR changes
              id: files
              if: github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
                      --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"
            # The token is not set on this step: it runs a script from the PR checkout.
            - name: Decide whether drift is enforced
              id: scope
              env:
                  EVENT: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" != "pull_request" ]; then
                      echo "enforce=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  node scripts/acr-pin-scope.mjs < "$RUNNER_TEMP/pr-files.txt" >> "$GITHUB_OUTPUT"
            - name: Compare the vendored pin with acr main
              id: check
              continue-on-error: true
              run: node scripts/check-acr-pin-drift.mjs
            - name: Advisory drift (this PR does not touch the pin)
              if: steps.check.outcome == 'failure' && steps.scope.outputs.enforce != 'true'
              run: |
                  echo "::warning title=ACR pin drift (advisory)::The ACR pin differs from acr main or the check could not run. This PR does not touch the pin, so it is not blocked. See the check step log; main carries the drift issue."
            - name: Fail on drift
              if: steps.check.outcome == 'failure' && steps.scope.outputs.enforce == 'true'
              run: exit 1

    bump:
        needs: drift
        if: always() && github.event_name != 'pull_request' && needs.drift.outputs.status == 'drift'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        concurrency:
            group: acr-pin-bump
            cancel-in-progress: false
        env:
            GH_REPO: ${{ github.repository }}
            BASE: ${{ github.ref_name }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
            OLD_PIN: ${{ needs.drift.outputs.pin }}
            NEW_PIN: ${{ needs.drift.outputs.head }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 22
            - name: Regenerate the vendored contracts at acr main
              run: |
                  set -euo pipefail
                  case "$NEW_PIN" in *[!0-9a-f]* | "") echo "bad acr sha"; exit 1 ;; esac
                  [ "${#NEW_PIN}" = 40 ]
                  pnpm install --frozen-lockfile --ignore-scripts
                  acr="$RUNNER_TEMP/acr"
                  git init -q "$acr"
                  git -C "$acr" fetch -q --depth 1 https://github.com/full-chaos/dev-health-acr.git "$NEW_PIN"
                  git -C "$acr" checkout -q FETCH_HEAD
                  # The pin is written in the generator and asserted by the contracts test.
                  sed -i "s/$OLD_PIN/$NEW_PIN/g" scripts/sync-acr-contracts.mjs src/lib/acr/__tests__/contracts.test.ts
                  ACR_ROOT="$acr" pnpm acr:contracts:generate
                  ACR_ROOT="$acr" pnpm acr:contracts:check
                  node scripts/check-acr-pin-drift.mjs
            # DEV_HEALTH_REPO_TOKEN (org secret) is set on this step only: install and generate run repo code and never see it.
            - name: Open or update the pin-bump PR
              env:
                  GH_TOKEN: ${{ secrets.DEV_HEALTH_REPO_TOKEN }}
              run: |
                  set -euo pipefail
                  test -n "$GH_TOKEN"
                  short=${NEW_PIN:0:8}
                  if [ "$BASE" = "$DEFAULT_BRANCH" ]; then
                      branch=bot/acr-pin-bump
                      draft=""
                  else
                      branch=bot/acr-pin-bump-test
                      draft="--draft"
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -q -b "$branch"
                  git add scripts/sync-acr-contracts.mjs src/lib/acr
                  if git diff --cached --quiet; then
                      echo "the regenerated files equal $BASE; nothing to bump"
                      exit 1
                  fi
                  git commit -q -m "chore(acr-pin): bump ACR contract pin to $short"
                  # One bot-owned branch; skip the push when it already carries these files, so an
                  # hourly run does not restart CI on an unchanged PR.
                  if git fetch -q origin "$branch" 2>/dev/null \
                      && git diff --quiet FETCH_HEAD HEAD -- scripts/sync-acr-contracts.mjs src/lib/acr; then
                      echo "branch $branch is already current"
                  else
                      git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$branch"
                  fi
                  title="chore(acr-pin): bump ACR contract pin to $short"
                  body=$(printf '%s\n' \
                      "## WHAT" \
                      "Bump the vendored ACR contract pin from $OLD_PIN to acr main $NEW_PIN. Regenerated by the ACR pin drift workflow with \`pnpm acr:contracts:generate\`, then checked with \`pnpm acr:contracts:check\` and the drift script." \
                      "" \
                      "## WHY" \
                      "A vendored contract file differs between the pin and acr main. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                      "" \
                      "## PROOF" \
                      "The generate, check and drift steps passed in the run above. This branch is rewritten on each new acr main; do not push to it.")
                  number=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
                  if [ -z "$number" ]; then
                      gh pr create --head "$branch" --base "$BASE" --title "$title" --body "$body" $draft
                  else
                      gh pr edit "$number" --title "$title" --body "$body"
                  fi

    drift-issue:
        needs: [drift, bump]
        if: >-
            always() && github.event_name != 'pull_request' &&
            (needs.drift.outputs.status == 'drift' || needs.drift.outputs.status == 'current')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        concurrency:
            group: acr-pin-drift-issue
            cancel-in-progress: false
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            STATUS: ${{ needs.drift.outputs.status }}
            BUMP_RESULT: ${{ needs.bump.result }}
            PIN: ${{ needs.drift.outputs.pin }}
            HEAD_SHA: ${{ needs.drift.outputs.head }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Open, update or close the drift issue
              run: |
                  set -euo pipefail
                  # The list API, not search: search is indexed late and would let a second issue open.
                  open=$(gh issue list --state open --limit 200 --json number,title \
                      --jq '[.[] | select(.title | startswith("ACR pin drift:")) | .number] | sort | .[]')
                  if [ "$STATUS" = "current" ]; then
                      for n in $open; do
                          gh issue close "$n" --comment "Drift cleared: the pin $PIN matches acr main $HEAD_SHA. Run: $RUN_URL"
                      done
                      exit 0
                  fi
                  # The pin-bump PR is the report; the issue is only the fallback when that step failed.
                  if [ "$BUMP_RESULT" = "success" ]; then
                      for n in $open; do
                          gh issue close "$n" --comment "The pin-bump PR is open for acr main $HEAD_SHA. Run: $RUN_URL"
                      done
                      exit 0
                  fi
                  title="ACR pin drift: $HEAD_SHA"
                  body=$(printf '%s\n' \
                      "The vendored ACR contract pin differs from acr main in at least one vendored file." \
                      "" \
                      "- Pin: $PIN" \
                      "- acr main: $HEAD_SHA" \
                      "- Detected by: $RUN_URL" \
                      "" \
                      "The automatic pin-bump PR failed in this run (see the bump job). Bump by hand: run \`pnpm acr:contracts:generate\` with \`ACR_ROOT\` at the acr main checkout, update \`SOURCE_COMMIT\` in \`scripts/sync-acr-contracts.mjs\`, and open a PR. This issue closes by itself when the pin matches or the bump PR is up." )
                  first=""
                  for n in $open; do
                      if [ -z "$first" ]; then
                          first=$n
                      else
                          gh issue close "$n" --comment "Duplicate of #$first."
                      fi
                  done
                  if [ -z "$first" ]; then
                      gh issue create --title "$title" --body "$body"
                  else
                      current=$(gh issue view "$first" --json title --jq .title)
                      if [ "$current" != "$title" ]; then
                          gh issue edit "$first" --title "$title" --body "$body"
                      fi
                  fi
