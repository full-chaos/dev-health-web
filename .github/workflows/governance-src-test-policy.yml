name: Governance - Src Test Policy

on:
    pull_request:
        types: [opened, synchronize, reopened, edited, ready_for_review]
        paths:
            - src/**
            - tests/**
            - .github/pull_request_template.md
            - .github/scripts/enforce-src-test-governance.mjs
            - .github/workflows/governance-src-test-policy.yml

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    enforce-src-test-policy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Fetch PR base ref
              run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 22

            - name: Enforce src test governance
              env:
                  GOVERNANCE_DIFF_BASE: FETCH_HEAD
              run: node .github/scripts/enforce-src-test-governance.mjs
