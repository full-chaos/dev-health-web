name: Agent format Context Fabric documentation

on:
  push:
    branches:
      - agent/context-fabric-local-setup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: agent/context-fabric-local-setup
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write README.md docs/context-fabric.md
      - name: Commit formatted documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/context-fabric.md
          git diff --cached --quiet && exit 0
          git commit -m 'Format Context Fabric documentation'
          git push origin HEAD:agent/context-fabric-local-setup
