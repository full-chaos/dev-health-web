name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - 'docs/**'
                        - '.github/workflows/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'playwright*.config.*'
                        - 'eslint.config.*'
                        - '.prettier*'
                        - 'lefthook.yml'
                        - 'eslint-plugin-design-lint/**'
                        - 'scripts/**'
                        - 'design-lint.allowlist.json'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'
                      e2e:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - '.github/workflows/tests.yml'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'playwright*.config.*'
                        - 'postcss.config.*'
                        - 'scripts/**'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    format:
        name: Format
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh format

    quality:
        name: Quality
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        env:
            ASK_DEV_OPS_ROOT: dev-health-ops
            ASK_DEV_OPS_MAIN_ROOT: dev-health-ops-main
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # Must stay equal to SOURCE_COMMIT in scripts/ask-dev-contracts.mjs
            # (scripts/__tests__/chaos-3017-ci-execution-contract.test.mjs reads
            # that script and asserts the two match). This SHA is ops main.
            - name: Checkout canonical Ask Dev ops contracts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: full-chaos/dev-health-ops
                  ref: b45450e19e8e9d6292e3cd88a94f71ed2d5619b3
                  path: dev-health-ops
                  persist-credentials: false
            # CHAOS-3511 currency guard: ops main's tip as of this run, checked
            # out to a SEPARATE path so it never disturbs the pinned checkout's
            # exact-SHA requirement above. ask-dev:contracts:check-currency
            # diffs the two over the consumed surface only.
            - name: Checkout current ops main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: full-chaos/dev-health-ops
                  ref: main
                  path: dev-health-ops-main
                  persist-credentials: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh quality

    build:
        name: Build
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh build

    unit:
        name: Unit tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh unit
            - name: Upload coverage lcov
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: coverage-lcov-${{ github.run_id }}-${{ github.run_attempt }}
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 90

    e2e-default:
        name: E2E tests (default, shard ${{ matrix.shard }}/3)
        needs: [changes]
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e-default ${{ matrix.shard }}/3
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-default-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 90
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-default-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 90

    e2e-onboarding:
        # Route-stress suites and Context Fabric run sequentially in this job rather
        # than as separate runners. GitHub's concurrency limits make every
        # extra parallel job a queue liability, and run_tests.sh isolates all
        # four suites regardless of which runner hosts them.
        name: E2E tests (route stress + onboarding + Context Fabric)
        needs: [changes]
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e-customer-push
            - run: bash ci/run_tests.sh e2e-navigation
            - run: bash ci/run_tests.sh e2e-onboarding
            - run: bash ci/run_tests.sh e2e-context-fabric
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-onboarding-context-fabric-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 90
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-onboarding-context-fabric-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 90

    design-lint:
        name: Design lint advisory
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run design lint advisory
              continue-on-error: true
              run: bash ci/run_tests.sh design-lint

    test:
        name: test
        needs: [changes, format, quality, build, unit, e2e-default, e2e-onboarding]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check change detection
              if: needs.changes.result != 'success'
              run: exit 1
            - name: Skip if no relevant changes
              if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
              run: |
                  echo "No test-relevant files changed; emitting success without running the suite."
                  echo "Keeps 'test' as a consistent required status check regardless of PR scope."
            - name: Check general test stages
              if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
              run: |
                  if [[ "${{ needs.format.result }}" != 'success' || "${{ needs.quality.result }}" != 'success' || "${{ needs.build.result }}" != 'success' || "${{ needs.unit.result }}" != 'success' ]]; then
                    exit 1
                  fi
            - name: Check E2E test stages
              if: needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true'
              run: |
                  if [[ "${{ needs.e2e-default.result }}" != 'success' || "${{ needs.e2e-onboarding.result }}" != 'success' ]]; then
                    exit 1
                  fi
            - name: Check E2E test stages were skipped
              if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e != 'true'
              run: |
                  if [[ "${{ needs.e2e-default.result }}" != 'skipped' || "${{ needs.e2e-onboarding.result }}" != 'skipped' ]]; then
                    exit 1
                  fi
