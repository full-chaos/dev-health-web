name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - 'docs/**'
                        - '.github/workflows/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'playwright*.config.*'
                        - 'eslint.config.*'
                        - '.prettier*'
                        - 'lefthook.yml'
                        - 'eslint-plugin-design-lint/**'
                        - 'scripts/**'
                        - 'design-lint.allowlist.json'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'
                      e2e:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - '.github/workflows/tests.yml'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'playwright*.config.*'
                        - 'postcss.config.*'
                        - 'scripts/**'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    format:
        name: Format
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh format

    quality:
        name: Quality
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh quality

    build:
        name: Build
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh build

    unit:
        name: Unit tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh unit

    integration:
        name: Integration tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh integration

    e2e-default:
        name: E2E tests (default, shard ${{ matrix.shard }}/3)
        needs: [changes]
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e-default ${{ matrix.shard }}/3
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-default-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 14
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-default-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 14

    e2e-onboarding:
        name: E2E tests (onboarding)
        needs: [changes]
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e-onboarding
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-onboarding-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 14
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-onboarding-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 14

    e2e-context-fabric:
        name: E2E tests (Context Fabric)
        needs: [changes]
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e-context-fabric
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-context-fabric-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 14
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-context-fabric-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 14

    design-lint:
        name: Design lint advisory
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run design lint advisory
              continue-on-error: true
              run: bash ci/run_tests.sh design-lint

    test:
        name: test
        needs: [changes, format, quality, build, unit, integration, e2e-default, e2e-onboarding, e2e-context-fabric]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check change detection
              if: needs.changes.result != 'success'
              run: exit 1
            - name: Skip if no relevant changes
              if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
              run: |
                  echo "No test-relevant files changed; emitting success without running the suite."
                  echo "Keeps 'test' as a consistent required status check regardless of PR scope."
            - name: Check general test stages
              if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
              run: |
                  if [[ "${{ needs.format.result }}" != 'success' || "${{ needs.quality.result }}" != 'success' || "${{ needs.build.result }}" != 'success' || "${{ needs.unit.result }}" != 'success' || "${{ needs.integration.result }}" != 'success' ]]; then
                    exit 1
                  fi
            - name: Check E2E test stages
              if: needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true'
              run: |
                  if [[ "${{ needs.e2e-default.result }}" != 'success' || "${{ needs.e2e-onboarding.result }}" != 'success' || "${{ needs.e2e-context-fabric.result }}" != 'success' ]]; then
                    exit 1
                  fi
            - name: Check E2E test stages were skipped
              if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e != 'true'
              run: |
                  if [[ "${{ needs.e2e-default.result }}" != 'skipped' || "${{ needs.e2e-onboarding.result }}" != 'skipped' || "${{ needs.e2e-context-fabric.result }}" != 'skipped' ]]; then
                    exit 1
                  fi
