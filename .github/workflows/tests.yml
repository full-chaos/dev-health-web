name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: dorny/paths-filter@v4.0.2
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - 'docs/**'
                        - '.github/workflows/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'playwright.config.*'
                        - 'playwright.live.config.*'
                        - 'eslint.config.*'
                        - '.prettier*'
                        - 'lefthook.yml'
                        - 'eslint-plugin-design-lint/**'
                        - 'scripts/design-lint.mjs'
                        - 'scripts/check-format-changed.mjs'
                        - 'design-lint.allowlist.json'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    format:
        name: Format
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh format

    quality:
        name: Quality
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh quality

    build:
        name: Build
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh build

    unit:
        name: Unit tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh unit

    integration:
        name: Integration tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh integration

    e2e:
        name: E2E tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_tests.sh e2e
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 14
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright/
                  if-no-files-found: warn
                  retention-days: 14

    design-lint:
        name: Design lint advisory
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 11.1.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run design lint advisory
              continue-on-error: true
              run: bash ci/run_tests.sh design-lint

    test:
        name: test
        needs: [changes, format, quality, build, unit, integration, e2e]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check change detection
              if: needs.changes.result != 'success'
              run: exit 1
            - name: Skip if no relevant changes
              if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
              run: |
                  echo "No test-relevant files changed; emitting success without running the suite."
                  echo "Keeps 'test' as a consistent required status check regardless of PR scope."
            - name: Check parallel test stages
              if: needs.changes.outputs.code == 'true'
              run: |
                  results='${{ toJson(needs) }}'
                  echo "${results}"
                  if [[ "${results}" == *'"result":"failure"'* || "${results}" == *'"result":"cancelled"'* ]]; then
                    exit 1
                  fi
