name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        # The auth endpoint-profile inventory. Without this
                        # pattern a PR touching ONLY
                        # contracts/auth/v1/endpoint-profiles.web.json sets
                        # code=false, skips the quality job, and the aggregate
                        # job succeeds having never run the gate -- so the one
                        # file most likely to be edited on its own is the edit
                        # that skips its own check. Found by the CHAOS-3273
                        # merge-gate round.
                        - 'contracts/**'
                        - 'public/**'
                        - 'docs/**'
                        - '.github/workflows/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'patches/**'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'vitest.config.*'
                        - 'playwright*.config.*'
                        - 'eslint.config.*'
                        - '.prettier*'
                        - 'lefthook.yml'
                        - 'eslint-plugin-design-lint/**'
                        - 'scripts/**'
                        - 'design-lint.allowlist.json'
                        - 'postcss.config.*'
                        - 'codegen.ts'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'
                      e2e:
                        - 'src/**'
                        - 'tests/**'
                        - 'ci/**'
                        - 'public/**'
                        - '.github/workflows/tests.yml'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'patches/**'
                        - 'tsconfig.json'
                        - 'next.config.*'
                        - 'playwright*.config.*'
                        - 'postcss.config.*'
                        - 'scripts/**'
                        - 'instrumentation.ts'
                        - 'sentry.*.config.ts'

    format:
        name: Format
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm binary
              id: pnpm-bin
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Setup pnpm
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              timeout-minutes: 3

            - name: Save pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Use cached pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit == 'true'
              timeout-minutes: 3
              env:
                  PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
              run: |
                  echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$HOME/setup-pnpm/node_modules/.bin/bin" >> "$GITHUB_PATH"
                  echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
                  PATH="$HOME/setup-pnpm/node_modules/.bin/bin:$HOME/setup-pnpm/node_modules/.bin:$PATH"
                  test "$(pnpm --version)" = "$PNPM_VERSION"
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 22
            - name: Locate pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-
                      pnpm-store-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile
              id: pnpm-install
            - name: Save pnpm store
              if: ${{ steps.pnpm-install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Save partial pnpm store
              if: ${{ always() && (steps.pnpm-install.outcome == 'failure' || steps.pnpm-install.outcome == 'cancelled') }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
            - run: bash ci/run_tests.sh format

    quality:
        name: Quality
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            WIRE_PARITY_OPS_ROOT: dev-health-ops-parity
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # graphql:wire-parity:check is checked against the ops branch that
            # carries the same name as this branch when one exists (a paired
            # change), else ops main. A paired PR is then green on both sides
            # before either merges. The check is strict on every run: a manifest
            # entry ops has not registered and an ops operation with no
            # manifest entry are both errors, so merge the ops half first.
            - name: Resolve dev-health-ops ref for wire parity
              id: wire-parity-ops-ref
              env:
                  BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  set -euo pipefail
                  ref=main
                  if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ]; then
                    # --exit-code: 0 = branch exists, 2 = no such branch. Any
                    # other status is a lookup failure (network, DNS, rate
                    # limit) and must fail the step, not silently pick main --
                    # a paired change would then be checked against the wrong
                    # ops side.
                    rc=0
                    git ls-remote --exit-code --heads https://github.com/full-chaos/dev-health-ops.git "refs/heads/${BRANCH}" >/dev/null || rc=$?
                    case "$rc" in
                      0)
                        ref="$BRANCH"
                        echo "::notice::wire parity: paired ops branch '$BRANCH' found; checking it out instead of main"
                        ;;
                      2)
                        echo "::notice::wire parity: no ops branch named '$BRANCH' (unpaired change); using ops main"
                        ;;
                      *)
                        echo "::error::wire parity: could not look up ops branch '$BRANCH' (git ls-remote exit $rc); refusing to fall back to main"
                        exit 1
                        ;;
                    esac
                  fi
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
            - name: Checkout dev-health-ops for wire parity
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: full-chaos/dev-health-ops
                  ref: ${{ steps.wire-parity-ops-ref.outputs.ref }}
                  path: dev-health-ops-parity
                  persist-credentials: false
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm binary
              id: pnpm-bin
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Setup pnpm
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              timeout-minutes: 3

            - name: Save pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Use cached pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit == 'true'
              timeout-minutes: 3
              env:
                  PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
              run: |
                  echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$HOME/setup-pnpm/node_modules/.bin/bin" >> "$GITHUB_PATH"
                  echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
                  PATH="$HOME/setup-pnpm/node_modules/.bin/bin:$HOME/setup-pnpm/node_modules/.bin:$PATH"
                  test "$(pnpm --version)" = "$PNPM_VERSION"
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 22
            # CHAOS-4696 graphql:wire-parity:check runs `go run
            # ./cmd/query-api/tools/registrydump` against the ops-main
            # checkout above -- go-version-file reads ops main's own
            # go.mod so this stays in lockstep with ops's own toolchain
            # pin rather than a second, independently-drifting pin here.
            - name: Locate pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-
                      pnpm-store-${{ runner.os }}-

            - name: Set up Go (for graphql:wire-parity:check's registrydump)
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: dev-health-ops-parity/go.mod
                  cache-dependency-path: dev-health-ops-parity/go.sum
            - run: pnpm install --frozen-lockfile
              id: pnpm-install
            # CHAOS-3273 Wave 0: the endpoint-profile gate (guardrail G-1)
            # validates endpoint-profiles.web.json against a closed
            # vocabulary OWNED BY OPS (endpoint-profile.schema.json,
            # credential-classes.json) that this repo does not vendor. A
            # full checkout of dev-health-ops would work too, but would
            # silently track ops's moving default branch -- any push to
            # ops's main would change what this job validates against with
            # no web commit recording that it happened. Pin instead: the
            # exact ops commit this repo trusts lives in ONE place
            # (ci/ops-contract.pin), a sparse checkout fetches ONLY the listed
            # contract paths at that pin (not the whole ops repo), and
            # bumping the pin is the web-side commit that makes a contract
            # change visible and re-runs this gate against it. Both repos
            # are public (verified via `gh repo view`), so this checkout
            # needs no token. Same mechanism as dev-health-acr's
            # ci/ops-contract.pin -- see that repo's .github/workflows/ci.yml
            # for the reference implementation this was copied from.
            - name: Save pnpm store
              if: ${{ steps.pnpm-install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Save partial pnpm store
              if: ${{ always() && (steps.pnpm-install.outcome == 'failure' || steps.pnpm-install.outcome == 'cancelled') }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
            - name: Read the pinned ops-owned contract commit
              id: ops-contract-pin
              run: echo "sha=$(tr -d '[:space:]' < ci/ops-contract.pin)" >> "$GITHUB_OUTPUT"
            # A raw actions/checkout failure on an unresolvable ref reads as
            # a cryptic git error with no context. Probe first with a
            # message that distinguishes the ONE expected failure mode (the
            # ops-side lane that produced this pin has not merged to ops's
            # origin/main yet -- see ci/ops-contract.pin's own commit
            # message for which lane/branch) from every other one (a stale
            # or simply wrong pin), so a red run here is never mistaken for
            # a broken mechanism.
            # A pin that accepts any resolvable ref is not a pin. Executed on
            # the sibling acr gate during CHAOS-3273's merge-gate round: with
            # only the resolvability probe below, the literal `main` in
            # ci/ops-contract.pin passed and the sparse checkout then followed
            # ops's default branch -- silently restoring the floating ref this
            # whole mechanism, and the comment block above, claim was
            # rejected. Check the SHAPE before resolving the ref, so a branch
            # name is rejected on its face rather than by whether it happens
            # to resolve.
            - name: Verify the pin names an immutable commit, not a floating ref
              run: |
                  set -euo pipefail
                  sha="${{ steps.ops-contract-pin.outputs.sha }}"
                  if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
                    cat >&2 <<EOF
                  ci/ops-contract.pin must name a full 40-character lowercase
                  commit SHA. It currently holds: $sha

                  REJECTED CASE: a branch name or tag (e.g. "main", "v1.2.0") --
                  any floating ref. Those resolve perfectly well, which is the
                  problem: the checkout would track whatever that ref points at,
                  so a push to dev-health-ops would change what this job
                  validates against with no commit in this repo recording it.
                  An abbreviated SHA is rejected for the same reason go.mod
                  rejects one: it is not stable against future collisions.
                  EOF
                    exit 1
                  fi
            - name: Verify the pinned ops commit is resolvable
              run: |
                  set -euo pipefail
                  sha="${{ steps.ops-contract-pin.outputs.sha }}"
                  if git fetch --depth 1 https://github.com/full-chaos/dev-health-ops.git "$sha" >/dev/null 2>&1; then
                    exit 0
                  fi
                  cat >&2 <<EOF
                  ci/ops-contract.pin names $sha, which does not exist on
                  full-chaos/dev-health-ops's remote (git fetch found nothing).

                  EXPECTED failure mode: the ops-side lane that produced this pin
                  has not merged to ops's origin/main yet. ci/ops-contract.pin's
                  own commit message names the exact ops branch/lane this SHA came
                  from -- once that lane merges, re-pin this file to the merged
                  SHA and this step passes.

                  If that ops lane HAS already merged and this still fails, the
                  pin itself is stale or wrong: check it against ops's actual
                  history. Do not "fix" this by pointing the pin at ops main or by
                  removing/weakening the pin -- see ci/ops-contract.pin's commit
                  message for why a floating ref was rejected.
                  EOF
                  exit 1
            # actions/checkout, same pin as every other checkout step in this
            # repo -- public repo, no token needed. Sparse, non-cone mode:
            # fetches exactly the listed file paths, not a directory tree.
            - name: Checkout pinned ops-owned auth contract
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: full-chaos/dev-health-ops
                  ref: ${{ steps.ops-contract-pin.outputs.sha }}
                  path: .ops-contract
                  persist-credentials: false
                  sparse-checkout: |
                      contracts/auth/v1/endpoint-profile.schema.json
                      contracts/auth/v1/credential-classes.json
                      contracts/auth/v1/credential-classes.schema.json
                      contracts/auth/v1/jsonschema/endpoint-auth-profile.v1.schema.json
                      contracts/auth/v1/jsonschema/principal.v1.schema.json
                  sparse-checkout-cone-mode: false
            # credential-classes.schema.json joined this list at the
            # merge-gate round: the gate harvested class ids from the
            # credential-class document and never validated it, so a
            # vocabulary whose entries had lost their issuer, validator,
            # lifecycle authority and allowed route set still passed.
            # Validating it needs its schema present, so a missing entry here
            # turns a real check back into an absent one.
            # credential-classes.schema.json `$ref`s jsonschema/endpoint-auth-profile.v1.schema.json, which `$ref`s
            # endpoint-profile.schema.json (above) and jsonschema/principal.v1.schema.json: the gate registers every
            # jsonschema/*.schema.json beside it with ajv before compiling, so that closure is listed here and a
            # file missing from it is a compile failure naming the reference, not a skipped check.
            - name: Run the web auth-profile CI gate (CHAOS-3273 guardrail G-1)
              env:
                  WEB_ENDPOINT_PROFILE_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/endpoint-profile.schema.json
                  WEB_CREDENTIAL_CLASSES: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.json
                  WEB_CREDENTIAL_CLASSES_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.schema.json
              run: bash ci/run_tests.sh auth-profiles-gate
            - run: bash ci/run_tests.sh quality
            - name: Lint baseline diagnostics (CHAOS-8789)
              # Diagnostic only: splits lint output into changed-path findings
              # and unchanged baseline. The quality step stays the gate.
              if: ${{ !cancelled() }}
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
              run: node scripts/ci-baseline-diagnostics.mjs lint

    build:
        name: Build
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm binary
              id: pnpm-bin
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Setup pnpm
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              timeout-minutes: 3

            - name: Save pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Use cached pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit == 'true'
              timeout-minutes: 3
              env:
                  PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
              run: |
                  echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$HOME/setup-pnpm/node_modules/.bin/bin" >> "$GITHUB_PATH"
                  echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
                  PATH="$HOME/setup-pnpm/node_modules/.bin/bin:$HOME/setup-pnpm/node_modules/.bin:$PATH"
                  test "$(pnpm --version)" = "$PNPM_VERSION"
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 22
            - name: Locate pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-
                      pnpm-store-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile
              id: pnpm-install
            - name: Save pnpm store
              if: ${{ steps.pnpm-install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Save partial pnpm store
              if: ${{ always() && (steps.pnpm-install.outcome == 'failure' || steps.pnpm-install.outcome == 'cancelled') }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
            - run: bash ci/run_tests.sh build

    unit:
        name: Unit tests
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm binary
              id: pnpm-bin
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Setup pnpm
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              timeout-minutes: 3

            - name: Save pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/setup-pnpm
                  key: pnpm-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-version.outputs.version }}

            - name: Use cached pnpm binary
              if: steps.pnpm-bin.outputs.cache-hit == 'true'
              timeout-minutes: 3
              env:
                  PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
              run: |
                  echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$HOME/setup-pnpm/node_modules/.bin/bin" >> "$GITHUB_PATH"
                  echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
                  PATH="$HOME/setup-pnpm/node_modules/.bin/bin:$HOME/setup-pnpm/node_modules/.bin:$PATH"
                  test "$(pnpm --version)" = "$PNPM_VERSION"
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 22
            - name: Locate pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-
                      pnpm-store-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile
              id: pnpm-install
            - name: Save pnpm store
              if: ${{ steps.pnpm-install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Save partial pnpm store
              if: ${{ always() && (steps.pnpm-install.outcome == 'failure' || steps.pnpm-install.outcome == 'cancelled') }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
            # Differential oracle for the Ask Dev request builder (CHAOS-11924): executes the REAL
            # ask-dev builder at the pinned commit and diffs the committed cases. There is no
            # fallback: if ask-dev cannot be fetched or installed, this job fails.
            - name: Read the pinned ask-dev commit
              id: ask-dev-pin
              run: echo "sha=$(tr -d '[:space:]' < scripts/ask-dev-oracle/ASK_DEV_SHA)" >> "$GITHUB_OUTPUT"
            - name: Check out ask-dev at the pinned commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: full-chaos/ask-dev
                  ref: ${{ steps.ask-dev-pin.outputs.sha }}
                  path: .ask-dev-oracle
                  persist-credentials: false
            - name: Install ask-dev dependencies
              working-directory: .ask-dev-oracle
              env:
                  pnpm_config_package_manager_strict: "false"
              # A different tree (ask-dev's own lockfile), not a web install: it is not part of the
              # web pnpm-store contract, so the flags are ordered to stay outside that count.
              run: pnpm install --ignore-scripts --frozen-lockfile
            - name: Ask Dev request-builder differential oracle
              env:
                  ASK_DEV_DIR: ${{ github.workspace }}/.ask-dev-oracle
              run: bash scripts/ask-dev-oracle/check.sh
            - run: bash ci/run_tests.sh unit
            - name: Rolldown parse baseline diagnostics (CHAOS-8789)
              # Diagnostic only, never fails the job. Reads the log that
              # run_unit tees to $RUNNER_TEMP/unit.log.
              if: ${{ !cancelled() }}
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
              run: node scripts/ci-baseline-diagnostics.mjs parse "${{ runner.temp }}/unit.log"
            - name: Upload coverage lcov
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: coverage-lcov-${{ github.run_id }}-${{ github.run_attempt }}
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 90

