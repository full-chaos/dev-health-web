name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@v4.0.1 # v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'vitest.config.*'
              - 'playwright.config.*'
              - 'playwright.live.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'codegen.ts'
              - 'instrumentation.ts'
              - 'sentry.*.config.ts'

  test:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip if no relevant changes
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "No test-relevant files changed; emitting success without running the suite."
          echo "Keeps 'test' as a consistent required status check regardless of PR scope."
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - name: Setup Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run CI test contract
        if: needs.changes.outputs.code == 'true'
        run: bash ci/run_tests.sh ci
      - name: Upload Playwright report
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright raw results and JUnit
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
