                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 90
            - name: Upload Playwright raw results and JUnit
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
