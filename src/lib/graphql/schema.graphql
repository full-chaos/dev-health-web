type Mutation {
  """Create a new saved report"""
  createSavedReport(orgId: String!, input: CreateSavedReportInput!): SavedReportType!

  """Update an existing saved report"""
  updateSavedReport(orgId: String!, reportId: String!, input: UpdateSavedReportInput!): SavedReportType

  """Delete a saved report"""
  deleteSavedReport(orgId: String!, reportId: String!): Boolean!

  """Clone a saved report with optional overrides"""
  cloneSavedReport(orgId: String!, input: CloneSavedReportInput!): SavedReportType

  """Trigger a manual report execution"""
  triggerReport(orgId: String!, reportId: String!): ReportRunType
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  """Get catalog of available dimensions, measures, and limits"""
  catalog(orgId: String!, dimension: DimensionInput = null, filters: FilterInput = null): CatalogResult!

  """Run batch analytics queries"""
  analytics(orgId: String!, batch: AnalyticsRequestInput!): AnalyticsResult!

  """Get home dashboard metrics"""
  home(orgId: String!, filters: FilterInput = null): HomeResult!

  """Query work graph edges with optional filters"""
  workGraphEdges(orgId: String!, filters: WorkGraphEdgeFilterInput = null): WorkGraphEdgesResult!

  """Paginated list of security alerts"""
  securityAlerts(orgId: String!, filters: SecurityAlertFilterInput = null, pagination: SecurityPaginationInput = null): SecurityAlertConnection!

  """Aggregated security posture for the dashboard"""
  securityOverview(orgId: String!, filters: SecurityAlertFilterInput = null): SecurityOverview!

  """List saved reports for an organization"""
  savedReports(orgId: String!, limit: Int! = 50, offset: Int! = 0): SavedReportConnection!

  """Get a saved report by ID"""
  savedReport(orgId: String!, reportId: String!): SavedReportType

  """List report runs for a saved report"""
  reportRuns(orgId: String!, reportId: String!, limit: Int! = 50): ReportRunConnection!

  """Compute capacity forecast on-demand"""
  capacityForecast(orgId: String!, input: CapacityForecastInput = null): CapacityForecast

  """List persisted capacity forecasts"""
  capacityForecasts(orgId: String!, filters: CapacityForecastFilterInput = null): CapacityForecastConnection!
}

