overrides:
    fast-uri: 3.1.4

auditConfig:
    # Next 16.2.9 pins optional sharp 0.34.5. Keep this narrowly scoped
    # exception until Next supports sharp >=0.35.0, then remove it.
    ignoreGhsas:
        - GHSA-f88m-g3jw-g9cj

allowBuilds:
    "@sentry/cli": true
    esbuild: true
    lefthook: true
    msw: true
    sharp: true
    unrs-resolver: true

minimumReleaseAgeExclude:
    - fast-uri@3.1.4
