networks:
  dev-health:
    external: true
    name: dev-health-network

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://dev-health-api:8000}
    image: dev-health-web:${VERSION:-latest}
    container_name: dev-health-web
    restart: unless-stopped
    networks:
      - dev-health
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://dev-health-api:8000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  web-dev:
    image: node:22-alpine
    container_name: dev-health-web-dev
    networks:
      - dev-health
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://dev-health-api:8000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    profiles:
      - dev
